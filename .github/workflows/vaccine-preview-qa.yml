name: Vaccine calculator preview QA
on:
  push:
    branches:
      - preview/vaccine-card-simplified-ux
  pull_request:
    paths:
      - 'herramientas/calculadora-vacunas/**'
      - 'tests/vaccine*.mjs'
      - 'package.json'
      - '.github/workflows/vaccine-preview-qa.yml'
permissions:
  contents: read
jobs:
  vaccine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run test:clinical
      - run: npm run test:experience
      - run: node tests/vaccineCardResolver.test.mjs
      - run: node --check herramientas/calculadora-vacunas/cardReader.mjs
