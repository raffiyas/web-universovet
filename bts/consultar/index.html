<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar cupones BTS | UniversoVet</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/bts/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/bts/supabase-config.js"></script></head><body><div class="bts-shell"><header class="container nav"><a class="brand" href="/bts"><span>💜</span><span>Concurso BTS</span></a><a class="pill" href="/bts">Volver</a></header><main class="container section"><div class="grid grid-2"><section class="card"><span class="badge">🎟️ Consulta pública</span><h1>Consulta tus cupones</h1><p class="section-lead">Ingresa tu número de WhatsApp tal como lo registraste en UniversoVet.</p><form id="lookupForm" class="form"><div class="field"><label for="phone">Número de WhatsApp</label><input id="phone" name="phone" autocomplete="tel" placeholder="Ej: 56935677904" required></div><button class="btn btn-primary" type="submit">Consultar mis cupones</button></form><div id="lookupMessage" hidden></div></section><section class="card"><h2>Resultado</h2><div id="lookupResult" class="notice">Aquí aparecerán tus cupones válidos. No se permite editar datos desde esta página.</div></section></div></main></div><script src="/bts/app.js"></script><script>document.getElementById('lookupForm').addEventListener('submit',async(e)=>{e.preventDefault();const msg=BTSApp.$('#lookupMessage'),res=BTSApp.$('#lookupResult');try{BTSApp.setMessage?.(msg,'Consultando...'); const data=await BTSApp.lookupCoupons(BTSApp.$('#phone').value); if(!data||!data.coupons.length){res.innerHTML='<p>No encontramos cupones asociados a este número. Revisa que esté escrito igual al número registrado en la clínica o escríbenos por WhatsApp.</p><a class="btn btn-primary" href="https://wa.me/56935677904">Consultar por WhatsApp</a>';BTSApp.setMessage?.(msg,'Consulta realizada.','success');return;} res.innerHTML=`<h3>${BTSApp.firstName?BTSApp.firstName(data.participant.full_name):data.participant.full_name}, tienes ${data.coupons.length} cupones válidos para el sorteo.</h3><p><strong>Tutor:</strong> ${data.participant.full_name}</p><p><strong>Mascota:</strong> ${(data.pets[0]&&data.pets[0].name)||'No registrada'}</p><div class="coupon-list">${data.coupons.map(c=>`<span class="coupon-code">${c.code}</span>`).join('')}</div>`;BTSApp.setMessage?.(msg,'Consulta realizada.','success');}catch(err){res.innerHTML='';msg.hidden=false;msg.className='message danger';msg.textContent=err.message;}});</script></body></html>
